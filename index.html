<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Routine</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1A21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF3F6;--card:#FFFFFF;--ink:#13222B;--mute:#51636E;--line:#D3DDE3;--p1:#7A4FD1;--p2:#D98A00;--p3:#1F6FEB;--p4:#0E9272;--tint:#F5F8FA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A21;--card:#17262F;--ink:#E8F0F4;--mute:#9DB0BB;--line:#2A3E49;--p1:#A98BEF;--p2:#F2B03A;--p3:#6AA2FF;--p4:#3FD1A8;--tint:#1B2D38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A21;--card:#17262F;--ink:#E8F0F4;--mute:#9DB0BB;--line:#2A3E49;--p1:#A98BEF;--p2:#F2B03A;--p3:#6AA2FF;--p4:#3FD1A8;--tint:#1B2D38;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
main{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(10px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:clamp(20px,3.4vh,26px);line-height:1.1;font-weight:800;letter-spacing:-.02em}
.sub{margin:0;color:var(--mute);font-size:12.5px}
.tipbtn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.bar{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px;flex:none}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:11.5px;min-width:0;white-space:nowrap}
.days{display:flex;gap:4px;flex:none}
.days span{flex:1;text-align:center;padding:4px 0;border-radius:8px;font-weight:600;font-size:11.5px;background:var(--p4);color:#fff}
.days span.off{background:var(--tint);color:var(--mute);border:1px dashed var(--line)}
.phases{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
section{flex:calc(var(--r) + 1.3) 1 0;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:6px 8px 7px;display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
.ph h2{margin:0;font-size:14.5px;font-weight:800;color:var(--c)}
.ph b{font-size:12px;color:var(--mute);font-weight:600}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--r),minmax(0,1fr));gap:5px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;min-height:0;height:100%;overflow:hidden;padding:0 9px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:9px;background:var(--tint);color:var(--ink);font:600 12.5px/1.15 inherit;font-family:inherit;cursor:pointer}
.chip span{flex:1;min-width:0;font-size:12px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip:active{transform:scale(.98)}
.chip:focus-visible,.tipbtn:focus-visible,.sheet button:focus-visible{outline:3px solid var(--c,var(--p3));outline-offset:2px}
.chip i{flex:none;font-style:normal;font-size:11.5px;color:var(--c);font-weight:800;white-space:nowrap;text-align:right}
.btns{display:flex;gap:6px;flex:none}
.startbtn{flex:none;border:0;border-radius:12px;background:var(--p4);color:#fff;padding:11px;font:800 16px inherit;font-family:inherit;cursor:pointer}
.startbtn:active{transform:scale(.99)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .startbtn,:root:not([data-theme="light"]) .rnav .go{color:#0F1A21}}
:root[data-theme="dark"] .startbtn,:root[data-theme="dark"] .rnav .go{color:#0F1A21}
.chip.done{background:var(--card);opacity:.65}
.chip.done span{text-decoration:line-through}
.chip.done span::before{content:"✓ ";font-weight:800;color:var(--c);display:inline-block;text-decoration:none}
.chead{margin:14px 0 0;font-size:13px;font-weight:800;color:var(--c)}
.crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--tint);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:6px;font:600 14.5px inherit;font-family:inherit;cursor:pointer}
.crow .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--mute);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:800}
.crow .nm{flex:1}
.crow em{font-style:normal;color:var(--mute);font-size:12.5px}
.crow.on .box{background:var(--c);border-color:var(--c);color:#fff}
.crow.on .nm{text-decoration:line-through;color:var(--mute)}
.run{position:fixed;inset:0;background:var(--bg);z-index:5;display:none}
.run.on{display:block}
.rwrap{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px))}
.rtop{display:flex;justify-content:space-between;align-items:center;flex:none}
.lbl{color:var(--mute);font-size:12px;font-weight:600}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.seg{display:flex;gap:2px;height:8px;flex:none}
.seg i{flex:1;border-radius:3px}
.rbody{flex:1;min-height:0;overflow:auto;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c,var(--p4));border-radius:14px;padding:14px}
.rbody h2{margin:2px 0 0;font-size:24px;line-height:1.15;font-weight:800}
.rbody p{margin:8px 0 0}
.rph{color:var(--c);font-weight:800;font-size:13px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.exT{text-align:right}
.exT small{display:block;color:var(--mute);font-size:11.5px}
.exT b{font-size:30px;font-variant-numeric:tabular-nums;color:var(--c)}
.rest{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:8px 10px;background:var(--tint)}
.rest.on{border:1px solid var(--p2)}
.rl{font-size:12px;font-weight:800;color:var(--p2)}
.rbt{display:flex;gap:6px;margin-top:6px}
.rest button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 4px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.rbig{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.rnav{display:flex;gap:8px;flex:none}
.rnav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.rnav .go{flex:1;border:0;background:var(--p4);color:#fff;font-weight:800;font-size:17px}
.rnav button:disabled{opacity:.4}
.run button:focus-visible,.startbtn:focus-visible,.crow:focus-visible{outline:3px solid var(--p3);outline-offset:2px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,16,.5);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-top:5px solid var(--c,var(--p3));border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:82dvh;overflow:auto;transform:translateY(105%);transition:transform .22s ease-out;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh-head h3{margin:0;font-size:20px;line-height:1.2;font-weight:800}
.src{color:var(--mute);font-size:13px;margin:2px 0 0}
.close{flex:none;border:0;background:var(--tint);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.dose{display:inline-block;margin:10px 0 4px;background:var(--c);color:#fff;border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px}
.sheet p{margin:8px 0 0}
.k{font-weight:600;color:var(--c)}
.alt{background:var(--tint);border-radius:9px;padding:9px 11px;margin-top:10px;font-size:14px}
.nav{display:flex;gap:8px;margin-top:14px}
.nav button{flex:1;border:1px solid var(--line);background:var(--tint);color:var(--ink);border-radius:10px;padding:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.tipitem{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.tipitem b{display:block}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Your daily routine</h1>
      <p class="sub">35–40 min · 5 days a week · tap an exercise</p>
    </div>
    <div class="btns"><button class="tipbtn" id="chkbtn" type="button">Checklist</button><button class="tipbtn" id="tipbtn" type="button">Tips</button></div>
  </div>
  <div class="bar" id="bar"></div>
  <div class="days"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span class="off">Fri</span><span class="off">Sat</span><span>Sun</span></div>
  <button class="startbtn" id="startbtn" type="button">Start exercise</button>
  <div class="phases" id="app"></div>
</main>

<div class="run" id="run" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Workout"><div class="rwrap" id="rwrap"></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="shTitle"></div>

<script>
var P=[
{t:'1 · Posture, neck & jaw',m:'~7–8 min',c:'var(--p1)',w:7.5,rule:'Do these in order, right after waking up or before the strength circuit.',e:[
['Chin pucker','Double chin lip pucker','Dr.Cracks','20 reps','Tilt your head up and pucker your lips.','Sit or stand tall. Tilt your head back until you feel the stretch under your chin, pucker your lips toward the ceiling, then relax. That is 1 rep.','No equipment needed.'],
['Pen jaw lift','Pen jaw line lift','Pierre Dalati','100 quick reps','Bite a pen sideways and lift your jaw up and down.','Hold a pen horizontally between your teeth. Keep your lips relaxed and move your jaw up and down in quick, small motions.','Any clean pen, pencil or spoon handle works.'],
['Pen 3D face','Pen 3D face movement','Pierre Dalati','100 quick reps','Bite the pen and move your jaw gently side to side.','Keep the pen between your teeth and slide your jaw left and right smoothly. Go gently and stop if your jaw clicks or hurts.','Any clean pen, pencil or spoon handle works.'],
['Pen lip hold','Pen lip hold','Pierre Dalati','Hold 1 min','Hold the pen with your lips only.','Pinch the pen with your lips, not your teeth. Breathe through your nose and keep your face relaxed.','Any pen, pencil or spoon handle works.'],
['Lip hold + tilt','Pen lip hold + head tilt','Pierre Dalati','Hold 1 min','Hold the pen with your lips and tilt your head up.','Same lip hold, but tilt your head back so your chin points to the ceiling. Keep the pen level.','Any pen, pencil or spoon handle works.'],
['Hunch neck ext.','Hunch neck extension','Pierre Dalati','10 sec × 3 sets','Sit at the bed edge, lean back with arms extended.','Sit on the edge of a bed with your arms straight behind you, hands on the mattress. Lean back, let your chest open and your head drop back gently. Hold 10 seconds, rest, repeat 3 times.','No bed edge? Use a sturdy chair seat or the floor with your hands behind you.'],
['Ear touch & clasp','Ear touch & hand clasp','Exercise Universe','50–100 reps','Touch your ears, then clasp your hands behind your back.','Bring your hands to your ears with elbows wide. Then clasp your hands behind your back, squeeze your shoulder blades and lift your chest. Repeat.','No equipment needed.'],
['Shoulder rotations','External shoulder rotations','Exercise Universe','50–100 reps','Rotate your shoulders outward.','Keep your elbows bent at your sides. Rotate your forearms outward, squeezing your shoulder blades back, then return.','No equipment needed. A light resistance band makes it harder if you have one.']]},
{t:'2 · Dynamic warm-up',m:'~3 min',c:'var(--p2)',w:3,rule:'Move smoothly. This prepares your shoulders, knees and hips.',e:[
['Over-and-backs','Over-and-backs','Jeremy Ethier','15 reps','Use a towel, broomstick or resistance band.','Hold the towel wide in front of your thighs with straight arms. Raise it overhead and down behind you, then reverse. Hold wider if it feels tight.','No band? A towel, broomstick, belt or rolled shirt all work.'],
['High pulls','High pulls','Exercise Universe','30 quick reps','Drive your elbows up and back.','Start with hands at your waist. Pull your elbows up high and back past your shoulders in a fast, controlled motion.','No equipment needed.'],
['Bodyweight squats','Bodyweight squats','Gentle','10 slow reps','Warm up your knees and hips.','Feet shoulder-width apart. Sit your hips back and down, keep your chest tall and your heels on the floor, then stand.','No equipment needed.']]},
{t:'3 · Full-body strength circuit',m:'~20–22 min',c:'var(--p3)',w:21,rule:'Do 3 total rounds. Rest 45–60 seconds between exercises and 90 seconds between rounds.',e:[
['Push-ups','Push-ups (normal or deficit)','KMLX / Bro Pump','12–15 reps','Chest, shoulders and triceps.','Hands under your shoulders, body in a straight line. Lower your chest to the floor, then press up. For deficit push-ups, rest your hands on raised surfaces so your chest dips lower.','Deficit without equipment: put each hand on a stack of books. Too hard? Do them on your knees.'],
['Pike push-ups','Pike push-ups','Bro Pump / KMLX','8–12 reps','Overhead shoulder pressing.','Make an upside-down V with your hips high. Bend your elbows to lower the top of your head toward the floor, then press back up.','No equipment needed. For more challenge, raise your feet on a chair.'],
['Split / tempo squats','Bulgarian split squats or tempo squats','Bro Pump','10–12 per leg, or 15 slow squats','Quads and glutes.','Split squat: put your back foot on a raised surface, drop your back knee straight down, then drive up through the front heel. Tempo squat: take 3 seconds going down, then stand.','No bench? Use a chair, sofa or bed for your back foot. Or just do the 15 slow tempo squats.'],
['Backpack rows','Backpack rows','Bro Pump','12–15 reps','Upper back thickness and lat strength.','Load a backpack with books. Hinge forward with a flat back, let the bag hang, then pull it to your lower ribs and lower it slowly.','No dumbbells needed. A water jug or a heavy bag also works.'],
['Hip flexor stretch','Hip flexor lunge stretch','Pierre Dalati / Jeremy Ethier','10–15 sec per side','Releases tight hip flexors and anterior pelvic tilt.','Kneel on one knee with the other foot forward. Tuck your tailbone under and squeeze the glute of the back leg. Lean forward slightly until you feel the front of the hip stretch.','Pad your back knee with a folded towel or cushion.']]},
{t:'4 · Core, posture & glute finisher',m:'~5 min',c:'var(--p4)',w:5,rule:'Do these as a final circuit with minimal rest between movements.',e:[
['Glute bridges','Glute bridges','Jeremy Ethier','1 set of 15–20','Squeeze your glutes hard at the top.','Lie on your back with knees bent. Push through your heels, lift your hips until your body is straight, squeeze, then lower.','No equipment needed. Make it harder by going one leg at a time.'],
['Back squeezes','Double-arm back squeezes','Exercise Universe','1 set of 30–50','Both arms squeeze your shoulder blades together.','Stand tall with arms bent at your sides. Pull both elbows back and squeeze your shoulder blades together, then release.','No equipment needed.'],
['Reverse snow angels','Reverse snow angels','Bro Pump','1 set of 12–15 slow reps','Lie on your stomach.','Lie face down with arms by your sides and palms down. Lift your chest slightly and sweep your arms in a wide arc overhead, then back to your sides, slowly.','No equipment needed.'],
['Plank / hollow hold','Plank or hollow body hold','KMLX / Bro Pump','Hold 45–60 sec','Core.','Plank: forearms on the floor, body in a straight line, abs tight. Hollow hold: lie on your back, lift your shoulders and legs off the floor with your lower back pressed down.','Use a towel or mat under your elbows or back. Too hard? Plank from your knees.']]}];

var DOSE={
'Chin pucker':'20×','Pen jaw lift':'100×','Pen 3D face':'100×','Pen lip hold':'1 min','Lip hold + tilt':'1 min','Hunch neck ext.':'3×10s','Ear touch & clasp':'50–100×','Shoulder rotations':'50–100×',
'Over-and-backs':'15×','High pulls':'30×','Bodyweight squats':'10×',
'Push-ups':'3×12–15','Pike push-ups':'3×8–12','Split / tempo squats':'3×10–12','Backpack rows':'3×12–15','Hip flexor stretch':'10–15s',
'Glute bridges':'15–20×','Back squeezes':'30–50×','Reverse snow angels':'12–15×','Plank / hollow hold':'45–60s'};

var TIPS=[['Progression','When 15 push-ups or rows feel easy, slow down: 4 seconds down, 1 second pause. Or add a few heavy books to your backpack.'],['Hydration','Keep a water bottle within reach, especially during Phase 3.'],['Rest days','Take Friday and Saturday off every week so your muscles and joints can recover.']];

var bar=document.getElementById('bar'),app=document.getElementById('app'),sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim'),flat=[],cur=-1,opener=null,h='';
P.forEach(function(p,pi){
  bar.insertAdjacentHTML('beforeend','<div style="flex:'+p.w+';background:'+p.c+'">'+(p.w>2?p.m.replace('~',''):'')+'</div>');
  var rows=Math.ceil(p.e.length/2);
  h+='<section style="--c:'+p.c+';--r:'+rows+'"><div class="ph"><h2>'+p.t+'</h2><b>'+p.m+'</b></div><div class="grid">';
  p.e.forEach(function(x){
    flat.push({p:p,x:x});
    h+='<button type="button" class="chip" data-i="'+(flat.length-1)+'"><span>'+x[0]+'</span><i>'+(DOSE[x[0]]||'')+'</i></button>';
  });
  h+='</div></section>';
});
app.innerHTML=h;

function open_(){sheet.classList.add('on');scrim.classList.add('on');sheet.setAttribute('aria-hidden','false')}
function close_(){sheet.classList.remove('on');scrim.classList.remove('on');sheet.setAttribute('aria-hidden','true');if(opener)opener.focus()}
function showEx(i){
  cur=i;var o=flat[i],p=o.p,x=o.x;
  sheet.style.setProperty('--c',p.c);
  sheet.innerHTML='<div class="sh-head"><div><h3 id="shTitle">'+x[1]+'</h3><p class="src" style="margin:2px 0 0">'+x[2]+'</p></div><button class="close" type="button" aria-label="Close">✕</button></div>'+
  '<span class="dose">'+x[3]+'</span>'+
  '<p><span class="k">Goal: </span>'+x[4]+'</p><p><span class="k">How: </span>'+x[5]+'</p>'+
  '<div class="alt"><span class="k">No-gym option: </span>'+x[6]+'</div>'+
  '<div class="alt" style="margin-top:8px"><span class="k">Phase note: </span>'+p.rule+'</div>'+
  '<div class="nav"><button type="button" data-n="-1"'+(i===0?' disabled style="opacity:.4"':'')+'>← Previous</button><button type="button" data-n="1"'+(i===flat.length-1?' disabled style="opacity:.4"':'')+'>Next →</button></div>';
  open_();
  sheet.querySelector('.close').focus();
}
function showTips(){
  sheet.style.setProperty('--c','var(--p3)');
  var t='<div class="sh-head"><h3 id="shTitle">Tips for consistency</h3><button class="close" type="button" aria-label="Close">✕</button></div>';
  TIPS.forEach(function(x){t+='<div class="tipitem"><b>'+x[0]+'</b>'+x[1]+'</div>'});
  sheet.innerHTML=t;open_();sheet.querySelector('.close').focus();
}
app.addEventListener('click',function(e){var b=e.target.closest('.chip');if(b){opener=b;showEx(+b.dataset.i)}});
document.getElementById('tipbtn').addEventListener('click',function(e){opener=e.currentTarget;showTips()});
sheet.addEventListener('click',function(e){
  if(e.target.closest('.close')){close_();return}
  var n=e.target.closest('[data-n]');
  if(n&&!n.disabled){showEx(cur+(+n.dataset.n));sheet.scrollTop=0}
});
scrim.addEventListener('click',close_);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet.classList.contains('on'))close_()});
/* ---------- checklist, workout runner, timers ---------- */
var KEY='routine-state-v1',S,R=document.getElementById('run'),rw=document.getElementById('rwrap'),startbtn=document.getElementById('startbtn'),chkbtn=document.getElementById('chkbtn'),tk=null,wl=null,ac=null;
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||S.date!==today())S={date:today(),done:{},run:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cnt(){return Object.keys(S.done).length}
function fmt(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return(h?h+':'+(m<10?'0':''):'')+m+':'+(c<10?'0':'')+c}
function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume()}catch(e){}}
function beep(){try{var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(ac.currentTime+.4)}catch(e){}try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
function unlock_(){try{if(wl)wl.release();wl=null}catch(e){}}
function refreshHome(){
  var n=cnt(),r=S.run;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('done',S.done[c.dataset.i]!=null)});
  chkbtn.textContent='Checklist '+n+'/'+flat.length;
  startbtn.textContent=(r&&!r.fin)?'Resume exercise · '+n+'/'+flat.length:(n===flat.length?'Start again':'Start exercise');
}
function exEl(now){var r=S.run,p=r.paused+(r.rest?now-r.rest.from:0);return now-r.exStart-p}
function endRest(at){var r=S.run;r.paused+=at-r.rest.from;r.rest=null}
function startRun(){
  unlockAudio();
  var r=S.run;
  if(!r||r.fin){
    var now=Date.now(),st=0,i;
    if(cnt()===flat.length)S.done={};
    for(i=0;i<flat.length;i++){if(S.done[i]==null){st=i;break}}
    S.run={start:now,idx:st,exStart:now,paused:0,rest:null,fin:null};save();
  }
  openRun();
}
function openRun(){R.classList.add('on');R.setAttribute('aria-hidden','false');renderRun();lock();clearInterval(tk);tk=setInterval(tick,250)}
function closeRun(){R.classList.remove('on');R.setAttribute('aria-hidden','true');clearInterval(tk);unlock_();refreshHome();startbtn.focus()}
function goTo(i){
  var r=S.run,now=Date.now();
  if(r.rest)endRest(now);
  if(i>=flat.length){r.fin=now}else{r.idx=Math.max(0,i);r.exStart=now;r.paused=0}
  save();renderRun();
}
function renderRest(){
  var el=document.getElementById('rest'),r=S.run;if(!el)return;
  if(r.rest){
    el.classList.add('on');
    el.innerHTML='<div class="rl">Resting</div><div class="rbig" id="tRest">0:00</div><button type="button" data-a="skiprest">Skip rest</button>';
  }else{
    el.classList.remove('on');
    el.innerHTML='<div class="rl">Rest timer</div><div class="rbt">'+[30,45,60,90].map(function(s){return'<button type="button" data-a="rest" data-s="'+s+'">'+s+'s</button>'}).join('')+'</div>';
  }
}
function renderRun(){
  var r=S.run;if(!r)return;
  var segs='';
  flat.forEach(function(o,i){segs+='<i style="background:'+(S.done[i]!=null?o.p.c:'var(--line)')+((!r.fin&&i===r.idx)?';outline:2px solid var(--ink);outline-offset:1px':'')+'"></i>'});
  var head='<div class="rtop"><div><div class="lbl">Total time</div><div class="big" id="tTot">0:00</div></div><button class="close" type="button" data-a="close" aria-label="Close">✕</button></div><div class="seg">'+segs+'</div>';
  if(r.fin){
    rw.innerHTML=head+'<div class="rbody"><h2>Routine complete</h2><p>You finished '+cnt()+' of '+flat.length+' exercises in <b>'+fmt(r.fin-r.start)+'</b>.</p></div><div class="rnav"><button type="button" data-a="again">Start over</button><button type="button" class="go" data-a="close">Close</button></div>';
    tick();return;
  }
  var o=flat[r.idx],p=o.p,x=o.x;
  rw.innerHTML=head+'<div class="rbody" style="--c:'+p.c+'"><div class="rph">'+p.t+' · '+(r.idx+1)+'/'+flat.length+'</div><h2>'+x[1]+'</h2>'+
  '<div class="rrow"><span class="dose">'+x[3]+'</span><span class="exT"><small>This exercise</small><b id="tEx">0:00</b></span></div>'+
  '<div class="rest" id="rest"></div>'+
  '<p><span class="k">Goal: </span>'+x[4]+'</p><p><span class="k">How: </span>'+x[5]+'</p>'+
  '<div class="alt"><span class="k">No-gym option: </span>'+x[6]+'</div>'+
  '<div class="alt" style="margin-top:8px"><span class="k">Phase note: </span>'+p.rule+'</div></div>'+
  '<div class="rnav"><button type="button" data-a="back"'+(r.idx===0?' disabled':'')+' aria-label="Previous exercise">←</button><button type="button" data-a="skip">Skip</button><button type="button" class="go" data-a="done">Okay, done ✓</button></div>';
  renderRest();tick();
}
function tick(){
  var r=S.run;if(!r)return;
  var now=Date.now(),t=document.getElementById('tTot');
  if(t)t.textContent=fmt((r.fin||now)-r.start);
  if(r.fin)return;
  if(r.rest&&now>=r.rest.end){var late=now-r.rest.end;endRest(r.rest.end);save();renderRest();if(late<3000)beep()}
  var e=document.getElementById('tEx');if(e)e.textContent=fmt(exEl(now));
  var tr=document.getElementById('tRest');if(tr&&r.rest)tr.textContent=fmt(r.rest.end-now+999);
}
rw.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  var a=b.dataset.a,r=S.run,now=Date.now();
  if(a==='close'){closeRun();return}
  if(a==='again'){S.run=null;S.done={};save();startRun();return}
  if(!r)return;
  if(a==='rest'){unlockAudio();var len=+b.dataset.s;r.rest={from:now,end:now+len*1000,len:len};save();renderRest();tick();return}
  if(a==='skiprest'){endRest(now);save();renderRest();tick();return}
  if(a==='done'){if(r.rest)endRest(now);S.done[r.idx]=Math.round(exEl(now)/1000);goTo(r.idx+1);return}
  if(a==='skip'){goTo(r.idx+1);return}
  if(a==='back'){goTo(r.idx-1)}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&R.classList.contains('on')){lock();tick()}});
function showChecklist(first){
  var st=sheet.scrollTop;
  sheet.style.setProperty('--c','var(--p4)');
  var t='<div class="sh-head"><h3 id="shTitle">Today’s checklist · '+cnt()+'/'+flat.length+'</h3><button class="close" type="button" aria-label="Close">✕</button></div>',last=null;
  flat.forEach(function(o,i){
    if(o.p!==last){last=o.p;t+='<div class="chead" style="--c:'+o.p.c+'">'+o.p.t+'</div>'}
    var on=S.done[i]!=null;
    t+='<button type="button" class="crow'+(on?' on':'')+'" style="--c:'+o.p.c+'" data-t="'+i+'" role="checkbox" aria-checked="'+on+'"><span class="box">✓</span><span class="nm">'+o.x[0]+'</span><em>'+(DOSE[o.x[0]]||'')+'</em></button>';
  });
  t+='<div class="nav"><button type="button" data-reset="1">Reset today</button></div>';
  sheet.innerHTML=t;
  if(first){open_();sheet.querySelector('.close').focus()}else{sheet.scrollTop=st}
}
chkbtn.addEventListener('click',function(e){opener=e.currentTarget;showChecklist(true)});
startbtn.addEventListener('click',startRun);
sheet.addEventListener('click',function(e){
  var c=e.target.closest('[data-t]');
  if(c){var i=+c.dataset.t;if(S.done[i]!=null)delete S.done[i];else S.done[i]=0;save();refreshHome();showChecklist(false);return}
  if(e.target.closest('[data-reset]')){S.done={};S.run=null;save();refreshHome();showChecklist(false)}
});
load();refreshHome();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
