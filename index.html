<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Routine</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F7F7F5;--card:#FFFFFF;--ink:#171717;--mute:#77776F;--line:#E4E3DF;--tint:#F2F2EF;--acc:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111111;--card:#181818;--ink:#ECECE8;--mute:#8A8A85;--line:#2B2B29;--tint:#1F1F1E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111111;--card:#181818;--ink:#ECECE8;--mute:#8A8A85;--line:#2B2B29;--tint:#1F1F1E;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
main[hidden]{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tl{display:flex;align-items:center;gap:10px;min-width:0}
.back{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:36px;height:36px;border-radius:50%;font:400 20px/1 inherit;cursor:pointer;padding:0}
h1{margin:0;font-size:clamp(20px,3.4vh,26px);line-height:1.1;font-weight:600;letter-spacing:-.02em}
.sub{margin:2px 0 0;color:var(--mute);font-size:12.5px}
.btns{display:flex;gap:6px;flex:none}
.tipbtn{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;font:600 13px inherit;cursor:pointer}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;gap:2px;flex:none}
.bar div{background:var(--line);min-width:0}
.bar div.d{background:var(--ink)}
.sec{flex:none;border:1px solid var(--line);border-radius:14px;padding:12px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px 10px}
.ph h2{margin:0;font-size:14.5px;font-weight:600}
.ph b{font-size:12px;color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;min-height:46px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:400 13px/1.2 inherit;cursor:pointer}
.chip .t{flex:1;min-width:0}
.chip i{flex:none;font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap;text-align:right}
.chip .x{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--mute);font-size:13px}
.chip:active{transform:scale(.98)}
.chip.done{opacity:.5}
.chip.done .t{text-decoration:line-through}
.chip.done .t::before{content:"✓ ";display:inline-block;text-decoration:none}
.startbtn,.donebtn{flex:none;border:0;border-radius:12px;background:var(--ink);color:var(--bg);padding:14px;font:600 16px inherit;cursor:pointer}
.startbtn:active{transform:scale(.99)}
.donebtn.on{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chead{margin:16px 0 0;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:6px;font:400 14.5px inherit;cursor:pointer}
.crow .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mute);display:grid;place-items:center;color:transparent;font-size:13px;font-weight:600}
.crow .nm{flex:1}
.crow em{font-style:normal;color:var(--mute);font-size:12.5px}
.crow.on .box{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.crow.on .nm{text-decoration:line-through;color:var(--mute)}
.rw{display:flex;gap:6px;align-items:stretch;margin-top:6px}
.rw .crow{margin-top:0;flex:1}
.rw .del{flex:none;width:42px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:10px;font-size:15px;cursor:pointer}
.evr{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.evr .nm{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.evr .nm em{font-style:normal;color:var(--mute);font-size:12px}
.evb{display:flex;gap:6px;margin-top:8px}
.evb button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:9px 0;font:400 14px inherit;cursor:pointer}
.evb button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.evnote{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);padding:10px;font:400 14px inherit;resize:vertical}
.trend{display:flex;align-items:flex-end;gap:2px;height:64px;margin:8px 0}
.trend i{flex:1;background:var(--ink);border-radius:2px 2px 0 0}
.trend i.n{background:var(--line)}
.run{position:fixed;inset:0;background:var(--bg);z-index:5;display:none}
.run.on{display:block}
.rwrap{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.rtop{display:flex;justify-content:space-between;align-items:center;flex:none}
.lbl{color:var(--mute);font-size:12px}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.seg{display:flex;gap:2px;height:4px;flex:none}
.seg i{flex:1;border-radius:2px}
.rbody{flex:1;min-height:0;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.rbody h2{margin:4px 0 0;font-size:24px;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.rbody p{margin:10px 0 0}
.rph{color:var(--mute);font-size:12.5px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.exT{text-align:right}
.exT small{display:block;color:var(--mute);font-size:11.5px}
.exT b{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.rest{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:10px}
.rest.on{border:1px solid var(--ink)}
.rl{font-size:12px;color:var(--mute)}
.rbt{display:flex;gap:6px;margin-top:6px}
.rest button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:9px 4px;font:400 14px inherit;cursor:pointer}
.rbig{font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.rnav{display:flex;gap:8px;flex:none}
.rnav button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:14px;font:400 15px inherit;cursor:pointer}
.rnav .go{flex:1;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:17px}
.rnav button:disabled{opacity:.35}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:82dvh;overflow:auto;transform:translateY(105%);transition:transform .22s ease-out}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh-head h3{margin:0;font-size:20px;line-height:1.2;font-weight:600}
.src{color:var(--mute);font-size:13px;margin:2px 0 0}
.close{flex:none;border:0;background:var(--tint);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.dose{display:inline-block;margin:10px 0 4px;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px}
.sheet p{margin:8px 0 0}
.k{font-weight:600}
.alt{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.nav{display:flex;gap:8px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px;font:400 14px inherit;cursor:pointer}
.tipitem{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.tipitem b{display:block;font-weight:600}
.seg2{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;flex:none}
.seg2 button{flex:1;border:0;background:none;color:var(--mute);border-radius:999px;padding:7px;font:400 13px inherit;cursor:pointer}
.seg2 button.on{background:var(--ink);color:var(--bg)}
.sum{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px;flex:none;padding:0 2px}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;cursor:pointer;flex:none}
.card:active{transform:scale(.99)}
.card .tx{flex:1;min-width:0}
.card .nm{font-weight:600;font-size:15.5px}
.card .sb{color:var(--mute);font-size:12px;margin-top:1px}
.card .st{flex:none;text-align:right;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.card .pg{height:2px;border-radius:1px;background:var(--line);margin-top:8px;overflow:hidden}
.card .pg i{display:block;height:100%;background:var(--ink)}
.card.done{opacity:.5}
.card.done .nm{text-decoration:line-through}
.bscroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.tbox{flex:none;border:1px solid var(--line);border-radius:16px;padding:14px}
.tbox .pg{height:2px;border-radius:1px;background:var(--line);margin:10px 0 12px;overflow:hidden}
.tbox .pg i{display:block;height:100%;background:var(--ink)}
.trow{display:flex;gap:8px}
.trow button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px;font:400 14px inherit;cursor:pointer}
.trow .main{flex:1.6;border:0;background:var(--ink);color:var(--bg);font-weight:600}
.mlog{margin-top:10px}
.mrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0 2px;border-top:1px solid var(--line)}
.mrow:first-child{margin-top:0}
.mrow span:first-child{flex:1}
.mrow .lbl{font-size:12px}
.mrow button{border:0;background:none;color:var(--mute);font-size:14px;cursor:pointer;padding:6px 8px}
.lnk{border:0;background:none;color:var(--mute);font:400 12px inherit;text-decoration:underline;cursor:pointer;padding:4px 0}
.qrow{display:flex;gap:6px;margin-top:14px}
.qrow button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px 2px;font:400 14px inherit;cursor:pointer}
.addf{display:flex;gap:6px;flex:none}
.addf input{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px 12px;font:400 15px inherit}
.addf select{flex:none;max-width:36%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 8px;font:400 14px inherit}
.addf button{flex:none;border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:0 18px;font:600 14px inherit;cursor:pointer}
.empty{color:var(--mute);font-size:13.5px;padding:4px 2px}
.clock{position:relative;height:14px;border-radius:7px;background:var(--tint);overflow:hidden;flex:none}
.clock i{position:absolute;top:0;bottom:0}
.clock .nowm{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.ctk{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);flex:none;margin-top:-6px;padding:0 1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:none}
.cal .wd{text-align:center;font-size:11px;color:var(--mute);padding:2px 0}
.cd{aspect-ratio:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:400 12px/1 inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.cd b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.cd.has{background:var(--tint)}
.cd.today{border-color:var(--ink)}
.cd:disabled{opacity:.3;cursor:default}
.cd.blank{border:0;background:none;cursor:default}
.mnav{display:flex;align-items:center;justify-content:space-between;flex:none}
.mnav button{border:1px solid var(--line);background:transparent;color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;padding:0}
.mnav b{font-weight:600}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);margin:4px 10px 0 0}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.hsec .mrow.ed{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hsec .mrow.ed:active{opacity:.6}
.hsec .mrow.addt{gap:6px;padding:8px 0 0;cursor:default}
.hsec .mrow.addt input{width:70px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);padding:7px 8px;font:400 13px inherit}
.hsec .mrow.addt button{border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--ink);font-size:13px}
.edhint{font-size:12px;color:var(--mute);margin:0 0 2px}
.hbig{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hsec{flex:none;border:1px solid var(--line);border-radius:14px;padding:12px}
.hsec h2{margin:0 0 6px;font-size:14.5px;font-weight:600}
.hsec .mrow{border-top:1px solid var(--line);padding:6px 0}
.hsec .mrow:first-of-type{border-top:0}
.hsec .items{color:var(--mute);font-size:12.5px;margin:0 0 4px}
.unl{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--mute);border-radius:14px;padding:12px 14px}
.unl .nm{font-weight:600;font-size:15.5px}
.unl .sb{color:var(--mute);font-size:12px;margin-top:1px}
.unl .st{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
</style>
</head>
<body>

<!-- ============ HOME: the whole day ============ -->
<main id="home">
  <div class="top">
    <div>
      <h1>Your day</h1>
      <p class="sub" id="homeSub"></p>
    </div>
    <div style="display:flex;gap:6px"><button class="tipbtn" type="button" id="cfgBtn" aria-label="Settings, sync and AI">⚙</button><button class="tipbtn" type="button" id="histBtn" aria-label="Open calendar and history">📅 Calendar</button></div>
  </div>
  <div class="seg2" id="typeSeg" role="group" aria-label="Schedule">
    <button type="button" data-t="wk">Sun – Thu</button>
    <button type="button" data-t="we">Fri – Sat</button>
  </div>
  <div class="bar" id="dayBar"></div>
  <div class="sum"><span id="sumDone"></span><span id="sumHrs"></span></div>
  <div class="clock" id="clock" role="img" aria-label="24-hour timeline of today"></div>
  <div class="ctk"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>
  <div class="sum"><span id="sumNow"></span><span id="sumLed"></span></div>
  <div class="sum"><span id="sumScore"></span></div>
  <button class="startbtn" id="evalBtn" type="button" style="width:100%">Evaluate your day · 5 min</button>
  <div class="list" id="dayList"></div>
</main>

<!-- ============ Block page (every block, incl. Exercise) ============ -->
<main id="vBlock" hidden></main>

<!-- ============ History calendar ============ -->
<main id="vHist" hidden></main>
<main id="vEval" hidden></main>

<div class="run" id="run" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Workout"><div class="rwrap" id="rwrap"></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="shTitle"></div>

<script>
var P0=[
{t:'1 · Posture, neck & jaw',m:'~7–8 min',c:'var(--acc)',w:7.5,rule:'Do these in order, right after waking up or before the strength circuit.',e:[
['Chin pucker','Double chin lip pucker','Dr.Cracks','20 reps','Tilt your head up and pucker your lips.','Sit or stand tall. Tilt your head back until you feel the stretch under your chin, pucker your lips toward the ceiling, then relax. That is 1 rep.','No equipment needed.'],
['Pen jaw lift','Pen jaw line lift','Pierre Dalati','100 quick reps','Bite a pen sideways and lift your jaw up and down.','Hold a pen horizontally between your teeth. Keep your lips relaxed and move your jaw up and down in quick, small motions.','Any clean pen, pencil or spoon handle works.'],
['Pen 3D face','Pen 3D face movement','Pierre Dalati','100 quick reps','Bite the pen and move your jaw gently side to side.','Keep the pen between your teeth and slide your jaw left and right smoothly. Go gently and stop if your jaw clicks or hurts.','Any clean pen, pencil or spoon handle works.'],
['Pen lip hold','Pen lip hold','Pierre Dalati','Hold 1 min','Hold the pen with your lips only.','Pinch the pen with your lips, not your teeth. Breathe through your nose and keep your face relaxed.','Any pen, pencil or spoon handle works.'],
['Lip hold + tilt','Pen lip hold + head tilt','Pierre Dalati','Hold 1 min','Hold the pen with your lips and tilt your head up.','Same lip hold, but tilt your head back so your chin points to the ceiling. Keep the pen level.','Any pen, pencil or spoon handle works.'],
['Hunch neck ext.','Hunch neck extension','Pierre Dalati','10 sec × 3 sets','Sit at the bed edge, lean back with arms extended.','Sit on the edge of a bed with your arms straight behind you, hands on the mattress. Lean back, let your chest open and your head drop back gently. Hold 10 seconds, rest, repeat 3 times.','No bed edge? Use a sturdy chair seat or the floor with your hands behind you.'],
['Ear touch & clasp','Ear touch & hand clasp','Exercise Universe','50–100 reps','Touch your ears, then clasp your hands behind your back.','Bring your hands to your ears with elbows wide. Then clasp your hands behind your back, squeeze your shoulder blades and lift your chest. Repeat.','No equipment needed.'],
['Shoulder rotations','External shoulder rotations','Exercise Universe','50–100 reps','Rotate your shoulders outward.','Keep your elbows bent at your sides. Rotate your forearms outward, squeezing your shoulder blades back, then return.','No equipment needed. A light resistance band makes it harder if you have one.']]},
{t:'2 · Dynamic warm-up',m:'~3 min',c:'var(--acc)',w:3,rule:'Move smoothly. This prepares your shoulders, knees and hips.',e:[
['Over-and-backs','Over-and-backs','Jeremy Ethier','15 reps','Use a towel, broomstick or resistance band.','Hold the towel wide in front of your thighs with straight arms. Raise it overhead and down behind you, then reverse. Hold wider if it feels tight.','No band? A towel, broomstick, belt or rolled shirt all work.'],
['High pulls','High pulls','Exercise Universe','30 quick reps','Drive your elbows up and back.','Start with hands at your waist. Pull your elbows up high and back past your shoulders in a fast, controlled motion.','No equipment needed.'],
['Bodyweight squats','Bodyweight squats','Gentle','10 slow reps','Warm up your knees and hips.','Feet shoulder-width apart. Sit your hips back and down, keep your chest tall and your heels on the floor, then stand.','No equipment needed.']]},
{t:'3 · Full-body strength circuit',m:'~20–22 min',c:'var(--acc)',w:21,rule:'Do 3 total rounds. Rest 45–60 seconds between exercises and 90 seconds between rounds.',e:[
['Push-ups','Push-ups (normal or deficit)','KMLX / Bro Pump','12–15 reps','Chest, shoulders and triceps.','Hands under your shoulders, body in a straight line. Lower your chest to the floor, then press up. For deficit push-ups, rest your hands on raised surfaces so your chest dips lower.','Deficit without equipment: put each hand on a stack of books. Too hard? Do them on your knees.'],
['Pike push-ups','Pike push-ups','Bro Pump / KMLX','8–12 reps','Overhead shoulder pressing.','Make an upside-down V with your hips high. Bend your elbows to lower the top of your head toward the floor, then press back up.','No equipment needed. For more challenge, raise your feet on a chair.'],
['Split / tempo squats','Bulgarian split squats or tempo squats','Bro Pump','10–12 per leg, or 15 slow squats','Quads and glutes.','Split squat: put your back foot on a raised surface, drop your back knee straight down, then drive up through the front heel. Tempo squat: take 3 seconds going down, then stand.','No bench? Use a chair, sofa or bed for your back foot. Or just do the 15 slow tempo squats.'],
['Backpack rows','Backpack rows','Bro Pump','12–15 reps','Upper back thickness and lat strength.','Load a backpack with books. Hinge forward with a flat back, let the bag hang, then pull it to your lower ribs and lower it slowly.','No dumbbells needed. A water jug or a heavy bag also works.'],

function isDone(id){
  if(bs(id).done)return true;
  if(BL[id].ex)return cnt()===flat.length&&listOf(id).filter(function(i){return i.c}).every(function(i){return D.it[itemKey(id,i.n)]});
  return false;
}
function stopRun(k,s,now){if(!s.run)return;s.spent+=now-s.run;(D.seg=D.seg||[]).push({id:k,s:s.run,e:now});if(k==='sleep')(s.sess=s.sess||[]).push({s:s.run,e:now});s.run=null}
function pauseAll(){var now=Date.now();Object.keys(D.b).forEach(function(k){stopRun(k,D.b[k],now)});pauseItems()}
function ts(k){return D.t[k]||(D.t[k]={spent:0,run:null})}
function itemMs(k,now){var t=D.t[k];return t?t.spent+(t.man||0)*60000+(t.run?(now||Date.now())-t.run:0):0}
function pauseItems(id){var now=Date.now();Object.keys(D.t).forEach(function(k){if(id&&k.split('|')[1]!==id)return;var t=D.t[k];if(t.run){t.spent+=now-t.run;t.run=null}})}
function planMin(d){var m=/(\d+(?:\.\d+)?)\s*min/.exec(d||'');if(m)return +m[1];m=/(\d+(?:\.\d+)?)\s*hrs?/.exec(d||'');return m?+m[1]*60:0}
function itemDose(id,name){var r=null;secsOf(id).forEach(function(sc){sc[2].forEach(function(it){if(it[0]===name)r=it[1]})});return r||''}

function dayStart(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function freshDay(){return{date:today(),b:{},it:{},t:{},seg:[]}}
function rollOver(){
  var o=D,p=String(o.date).split('-'),end=new Date(+p[0],+p[1]-1,+p[2]+1).getTime(),carry=[];
  Object.keys(o.b||{}).forEach(function(k){if(o.b[k].run){carry.push(k);stopRun(k,o.b[k],end)}});
  try{var H=JSON.parse(localStorage.getItem('day-history-v1'))||[];H.push({date:o.date,b:o.b,it:o.it,t:o.t,seg:o.seg||[],ev:o.ev||null,_u:Date.now()});localStorage.setItem('day-history-v1',JSON.stringify(H.slice(-120)))}catch(e){}
  try{if(typeof pushEntries==='function')pushEntries([o])}catch(e){}
  D=freshDay();var m=dayStart();carry.forEach(function(k){bs(k).run=m});
}
function fm(m){m=Math.round(m);return(m<0?'−':'')+fmtH(Math.abs(m)/60)}
function tm(t){return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function hasTimed(id){return secsOf(id).some(function(sc){return sc[2].some(function(it){return planMin(it[1])>0})})}
function itemDiff(id,name){
  var k=itemKey(id,name);if(!D.it[k])return null;
  var pm=planMin(itemDose(id,name)),sp=itemMs(k)/60000;
  if(!(pm>0)||sp<=0)return null;
  return pm-sp;
}
function ledger(now){
  var net=0;
  SCH[T].forEach(function(r){
    var id=r[0];if(id==='misc'||id==='reserve')return;
    /* Decision: sleeping less than planned does NOT add to reserve (it would reward cutting sleep). */
    if(id==='sleep'){var o=spentMs(id,now)/60000-hrsOf(id)*60;if(o>0)net-=o;return}
    if(hasTimed(id)){secsOf(id).forEach(function(sc){sc[2].forEach(function(it){var d=itemDiff(id,it[0]);if(d!==null)net+=d})});return}
    if(bs(id).done){var sp=spentMs(id,now)/60000;if(sp>0)net+=hrsOf(id)*60-sp}
  });
  var rLeft=hrsOf('reserve')*60+net-spentMs('reserve',now)/60000,mLeft=hrsOf('misc')*60-spentMs('misc',now)/60000;
  if(rLeft<0){mLeft+=rLeft;rLeft=0}
  return{net:net,rLeft:rLeft,mLeft:mLeft};
}
function colOf(id){return 'hsl('+(Object.keys(BL).indexOf(id)*47+20)+',35%,55%)'}
/* Unlogged time: a separate, always-running bucket = time elapsed today minus everything tracked or logged by hand. */
function trackedMs(now){return Object.keys(BL).reduce(function(a,id){return a+spentMs(id,now)},0)}
function unloggedMs(now){now=now||Date.now();return Math.max(0,now-dayStart()-trackedMs(now))}
function fmHM(ms){var m=Math.floor(ms/60000);return Math.floor(m/60)+':'+('0'+m%60).slice(-2)}
function tickUnl(){var el=document.getElementById('unlVal');if(el&&!homeEl.hidden)el.textContent=fmt(unloggedMs())}
function renderClock(now,LG){
  var st=dayStart(),W=864e5,en=st+W,sg=(D.seg||[]).slice(),h='',tr=0,run=null;
  Object.keys(D.b).forEach(function(k){if(D.b[k].run){run=k;sg.push({id:k,s:D.b[k].run,e:now})}});
  sg.forEach(function(g){
    var a=Math.max(g.s,st),z=Math.min(g.e,en);if(z<=a)return;tr+=z-a;
    h+='<i style="left:'+(a-st)/W*100+'%;width:'+Math.max(.2,(z-a)/W*100)+'%;background:'+colOf(g.id)+'"></i>';
  });
  h+='<b class="nowm" style="left:'+(now-st)/W*100+'%"></b>';
  document.getElementById('clock').innerHTML=h;
  document.getElementById('sumNow').textContent=run?'Now: '+BL[run].n+' ● '+fmt(spentMs(run,now)):'Nothing running';
  document.getElementById('sumLed').textContent='Reserve '+fm(LG.rLeft)+' · Misc '+fm(LG.mLeft);
}
function ledHtml(id,now){
  var LG=ledger(now),s=bs(id),h='<div class="alt" style="margin-top:0">';
  if(id==='sleep'){
    var ov=spentMs(id,now)/60000-hrsOf(id)*60;
    h+=(ov>0?'Over the plan by <b>'+fm(ov)+'</b> · taken from reserve, then misc.':'Sleep left in the plan: <b>'+fm(-ov)+'</b>. Going over cuts your reserve, then misc.');
    (s.sess||[]).forEach(function(g){h+='<div class="mrow"><span>'+tm(g.s)+' → '+tm(g.e)+'</span><span class="lbl">'+fm((g.e-g.s)/60000)+'</span></div>'});
    if(s.run)h+='<div class="mrow"><span>'+tm(s.run)+' → sleeping…</span></div>';
    h+='<div style="height:8px"></div>';
  }
  return h+'Reserve <b>'+fm(LG.rLeft)+'</b> · Misc <b>'+fm(LG.mLeft)+'</b></div>';
}
function itemLed(id,name,pm){
  if(!(pm>0))return'';
  var d=itemDiff(id,name);
  return '<form class="addf" id="manf" style="margin-top:10px"><input id="mani" type="number" inputmode="numeric" min="1" max="1440" placeholder="Check in: minutes it took" aria-label="Minutes it took"><button type="submit">Check in</button></form>'+
  '<div class="alt" style="margin-top:10px">'+(d===null?'Finish under '+fmtH(pm/60)+' and the spare minutes go to your reserve. Go over and the extra comes out of reserve, then misc.':(d>=0?'<b>+'+fm(d)+'</b> added to reserve':'<b>'+fm(-d)+'</b> over · taken from reserve, then misc'))+'</div>';
}
function show(v){
  clearInterval(btk);
  clearInterval(evtk);homeEl.hidden=v!=='home';bEl.hidden=v!=='block';hEl.hidden=v!=='hist';eEl.hidden=v!=='eval';if(v==='eval')renderEval();
  if(v==='home')renderDay();
  if(v==='hist')renderHist();
  window.scrollTo(0,0);
}
function renderDay(){
  var sch=SCH[T],cum=0,total=0,done=0,html='',bar='',now=Date.now(),LG=ledger(now);
  var d=new Date();
  document.getElementById('homeSub').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})+' · '+(T==='wk'?'Sun–Thu plan':'Fri–Sat plan');
  document.querySelectorAll('#typeSeg button').forEach(function(b){var on=b.dataset.t===T;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  sch.forEach(function(row){
    var id=row[0],hrs=hrsOf(id),b=BL[id];total+=hrs;cum+=hrs;
    var dn=isDone(id);if(dn)done++;
    var st='',pct=0;
    if(b.ex){var n=cnt();pct=n/flat.length*100;st=dn?'✓ Done':(n?n+'/'+flat.length:'')}
    else{var sp=spentMs(id,now);pct=Math.min(100,sp/(hrs*3600000)*100);st=dn?'✓ Done':(sp>=1000?fmt(sp):'')}
    if(bs(id).run&&!dn)st='● '+st;
    bar+='<div class="'+(dn?'d':'')+'" style="flex:'+hrs+'" title="'+esc(b.n)+'"></div>';
    html+='<button type="button" class="card'+(dn?' done':'')+'" style="--c:'+b.c+'" data-b="'+id+'"><span class="tx"><div class="nm">'+esc(b.n)+'</div><div class="sb">'+(id==='reserve'?fm(LG.rLeft)+' left':id==='misc'?fm(LG.mLeft)+' left':fmtH(hrs))+' · '+esc(noteOf(id))+'</div><div class="pg"><i style="width:'+pct+'%"></i></div></span><span class="st">'+st+'</span></button>';
  });
  document.getElementById('dayBar').innerHTML=bar;
  var unlHtml='<div class="unl" role="status"><span><div class="nm">Unlogged time</div><div class="sb">Runs all day when nothing is selected · logging time elsewhere takes it from here</div></span><span class="st" id="unlVal">'+fmt(unloggedMs(now))+'</span></div>';
  document.getElementById('dayList').innerHTML=unlHtml+html;
  renderClock(now,LG);homeScore();document.getElementById('sumDone').textContent=done+' of '+sch.length+' blocks done';
  document.getElementById('sumHrs').textContent=(+total.toFixed(2))+' h planned'+(total<24?' (+ '+(+(24-total).toFixed(2))+' h open)':'');
}

  curB=id;curG=-1;show('block');renderBlock();

}
function xtra(id){return PL[T+'|'+id]||0}
function hrsOf(id){var r=SCH[T].filter(function(x){return x[0]===id})[0];return r?r[1]+xtra(id)/60:0}
function psave(){try{localStorage.setItem(PKEY,JSON.stringify(PL))}catch(e){}}
function cumOf(id){var c=0,r=SCH[T];for(var i=0;i<r.length;i++){c+=hrsOf(r[i][0]);if(r[i][0]===id)break}return c}
function chipHtml(attrs,name,dose,done,del){
  return '<button type="button" class="chip'+(done?' done':'')+'" '+attrs+'><span class="t">'+esc(name)+'</span>'+(dose?'<i>'+esc(dose)+'</i>':'')+(del?'<span class="x" role="button" data-a="del" data-n="'+esc(name)+'"'+(del==='p'?' data-p="1"':'')+' aria-label="Remove '+esc(name)+'">✕</span>':'')+'</button>';
}
function secHtml(title,meta,chips){return '<section class="sec"><div class="ph"><h2>'+esc(title)+'</h2><b>'+esc(meta||'')+'</b></div><div class="grid">'+chips+'</div></section>'}
function renderBlock(){
  var id=curB,b=BL[id],ex=!!b.ex,hrs=hrsOf(id),s=bs(id),now=Date.now(),sp=spentMs(id,now);
  var old=bEl.querySelector('.bscroll'),keep=old?old.scrollTop:0;

  var t='<div class="top"><div class="tl"><button class="back" type="button" data-a="back" aria-label="Back to your day">‹</button><div><h1>'+esc(b.n)+'</h1><p class="sub">'+esc(sub)+'</p></div></div>';
  t+='<div class="btns">'+'<button class="tipbtn" type="button" data-a="chk">Checklist'+(total?' '+dn+'/'+total:'')+'</button>'+(ex?'<button class="tipbtn" type="button" data-a="tips">Tips</button>':'')+'</div></div>';
  t+='<div class="bscroll" style="--c:'+b.c+'">';
  t+='<div class="tbox"><div class="rtop"><div class="lbl">Time spent · planned '+fmtH(hrs)+'</div><button type="button" class="lnk" data-a="ext">Extend</button></div><div class="big" id="bT">'+fmt(sp)+'</div><div class="pg"><i id="bP" style="width:'+Math.min(100,sp/(hrs*3600000)*100)+'%"></i></div><div class="trow"><button type="button" class="main" data-a="toggle">'+(id==='sleep'?(s.run?'I’m awake':'Start sleep'):(s.run?'Pause':(sp>0?'Resume':'Start')))+'</button><button type="button" data-a="addt">+ Time</button><button type="button" data-a="subt">− Time</button><button type="button" data-a="reset">Reset</button></div>'+manLog(id)+'</div>'+ledHtml(id,now);
  if(ex){
    var r=S.run,n=cnt();
    t+='<button class="startbtn" id="startbtn" type="button" data-a="startex">'+((r&&!r.fin)?'Resume exercise · '+n+'/'+flat.length:(n===flat.length?'Start again':'Start exercise'))+'</button>';
    var fi=0;
    P.forEach(function(p){
      var chips='';
      p.e.forEach(function(x){chips+=chipHtml('data-a="ex" data-i="'+fi+'"',x[0],DOSE[x[0]],S.done[fi]!=null,'p');fi++});
      t+=secHtml(p.t,p.m,chips);
    });
  }else{
    secsOf(id).forEach(function(sc){
      var chips='';
      sc[2].forEach(function(it){chips+=chipHtml('data-a="item" data-n="'+esc(it[0])+'"',it[0],((D.t[itemKey(id,it[0])]||{}).run?'● ':'')+it[1],!!D.it[itemKey(id,it[0])],'p')});
      t+=secHtml(sc[0],sc[1],chips);
    });
  }
  var cu=L.filter(function(i){return i.c&&i.g==null});
  if(cu.length){
    var cc='';cu.forEach(function(i){cc+=chipHtml('data-a="item" data-n="'+esc(i.n)+'"',i.n,(D.t[itemKey(id,i.n)]||{}).run?'●':'',!!D.it[itemKey(id,i.n)],true)});
    t+=secHtml('Your tasks','',cc);
  }else if(!ex&&!L.length){
    t+='<div class="empty">No tasks yet. Add what you plan to do in this block.</div>';
  }
  (CG[id]||[]).forEach(function(g,gi){
    var gms=g.items.reduce(function(a,n){return a+itemMs(itemKey(id,n),now)},0),gc='';g.items.forEach(function(n){gc+=chipHtml('data-a="item" data-n="'+esc(n)+'"',n,(D.t[itemKey(id,n)]||{}).run?'●':'',!!D.it[itemKey(id,n)],true)});
    t+='<section class="sec"><div class="ph"><h2>'+esc(g.n)+'</h2>'+(gms>=60000?'<b>'+fm(gms/60000)+'</b>':'')+'<button type="button" class="lnk" data-a="delg" data-g="'+gi+'">Delete group</button></div><div class="grid">'+(gc||'<div class="empty" style="grid-column:1/-1">No tasks yet. Pick this group below when adding.</div>')+'</div></section>';
  });
  var hc=hiddenCount(id);
  if(hc)t+='<button type="button" class="lnk" data-a="restore">Restore '+hc+' removed preset'+(hc>1?'s':'')+'</button>';
  t+='</div>';
  var gl=CG[id]||[],gsel='';
  if(gl.length){gsel='<select id="addg" aria-label="Group">'+'<option value="-1">No group</option>'+gl.map(function(g,gi){return'<option value="'+gi+'"'+(curG===gi?' selected':'')+'>'+esc(g.n)+'</option>'}).join('')+'</select>'}
  t+='<form class="addf" id="addf"><input id="addi" type="text" placeholder="Add a task" aria-label="Add a task" maxlength="60" autocomplete="off">'+gsel+'<button type="submit">Add</button></form>';
  t+='<button type="button" class="lnk" data-a="newg" style="align-self:flex-start;flex:none">＋ New group</button>';
  t+='<button type="button" class="donebtn'+(s.done?' on':'')+'" data-a="done">'+(s.done?'✓ Block done · tap to undo':'Mark block done')+'</button>';
  bEl.innerHTML=t;
  var nb=bEl.querySelector('.bscroll');if(nb&&keep)nb.scrollTop=keep;
}
